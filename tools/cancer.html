<!-- drugcards:start 台大藥卡樣式。順序有三個約束：antibiotics.css 必須在
     drug-database.css 之前（.dose-fmt／renal-thr／tbl-sep 兩檔同特異度靠後載決勝），
     兩支都必須在 ui-sentence.css 之後（a.db-xlink 與造句版的 a{color:inherit} 同分）。 -->
<link rel="stylesheet" href="../css/antibiotics.css">
<link rel="stylesheet" href="../css/drug-database.css">
<!-- drugcards:end -->
<link rel="stylesheet" href="../css/nav.css">
<script src="../js/nav.js" defer></script>
<script src="../js/backlink.js" defer></script>
</head>
<body>
<div class="sheet">
<div class="view active" id="view-cancer">
  <div class="app-header">
    <div>
      <div class="eyebrow">Cancer Staging &amp; Treatment</div>
      <h1>癌症分期與治療</h1>
      <div class="sub">分期、淋巴結分群與治療決策</div>
    </div>
    <div class="back-stack">
      <!-- 「← 返回<來源頁>」由 js/backlink.js 於載入時自動插在這一顆之上 -->
      <button class="back-btn" onclick="location.href='../index.html#card-view-cancer'">← 返回主選單</button>
    </div>
  </div>

  <div class="gs-box">
    <div class="gs-field">
      <span class="gs-icon">⌕</span>
      <input type="search" class="gs-input" id="oncSearch" autocomplete="off" spellcheck="false"
             placeholder="搜尋癌症（中文／英文，例：胃、gastric、NET）…" oninput="renderPicker(this.value)">
      <button type="button" class="gs-clear" aria-label="清除查詢" hidden>×</button>
    </div>
  </div>
  <!-- 方磚圖版上色:亮色→淺灰版畫、暗色→深板岩反相。sRGB 不可省,否則中間調會再偏一次。
       尺寸給 1×1 移出畫面外,不用 width="0" height="0":零尺寸的 SVG 會被繪製階段整個略過,
       手機上第一屏以下的方磚就只剩底色(要捲到才補畫);癌別有 30 張,幾乎整頁都在第一屏以下。 -->
  <svg width="1" height="1" aria-hidden="true"
       style="position:absolute;left:-9999px;top:0;pointer-events:none"><defs>
    <filter id="plate-duo" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.100 0.940"/>
        <feFuncG type="table" tableValues="0.095 0.928"/>
        <feFuncB type="table" tableValues="0.085 0.906"/>
      </feComponentTransfer>
    </filter>
    <filter id="plate-cyano" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.82 0.169"/>
        <feFuncG type="table" tableValues="0.87 0.188"/>
        <feFuncB type="table" tableValues="0.92 0.202"/>
      </feComponentTransfer>
    </filter>
  </defs></svg>
  <div id="oncPicker"></div>
  <div id="oncDetail" style="display:none;"></div>

  <footer class="tool-footer" style="margin-top:24px;">
    分期依 AJCC Cancer Staging Manual, 8th ed.（Amin MB et al., Springer 2017）與各部位 AJCC v9 更新；治療依 NCCN Clinical Practice Guidelines 及內文所列臨床試驗。各癌症之主要文獻列於該癌症頁下方。本頁為教學整理，非商業指南之重製。
  </footer>
</div>
</div>
